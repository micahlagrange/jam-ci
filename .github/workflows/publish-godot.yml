name: publish-godot

# Build a Godot game for the web (WebGL 2, no threads) on a GitHub-hosted Linux
# runner and upload it as the `web` artifact. Called from a game's
# .github/workflows/publish.yml stub; see README.md. CI no longer copies the
# build anywhere: the public front door (`base`) PULLS builds, its scheduler runs
# `gh run download` for the newest successful run (every 5 minutes).
#
# Artifact contract: name `web`, files at the artifact root (index.html, index.js,
# index.wasm, index.pck, ... and build-info.txt whose first line is the full commit
# SHA that was built). Every push, on any branch, uploads it. On the default
# branch only, the job then polls <live_url>build-info.txt until the live site
# serves this commit (or fails after 15 minutes).
#
# There is no test suite: a clean export is the gate. If the project has an
# "Android" export preset a debug APK is built too, as the `android` artifact;
# an APK failure never blocks the web build.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build; empty means the triggering commit'
        type: string
        default: ''
      project_dir:
        description: 'Folder holding project.godot, relative to the repo root'
        type: string
        default: '.'
      godot_version:
        description: 'Godot release, e.g. 4.7.2 (the official -stable build)'
        type: string
        default: '4.7.2'
      web_preset:
        description: 'Name of the Web export preset'
        type: string
        default: Web
      android:
        description: 'Also build a debug APK when the project has an Android preset'
        type: boolean
        default: true
      live_url:
        description: 'Public URL of the game latest path (ends with /); polled after upload on the default branch'
        type: string
        default: https://base.junco-diatonic.ts.net:10000/


# A queued build waits instead of killing a running one.
concurrency:
  group: godot-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: ${{ inputs.godot_version }}
      PROJECT_DIR: ${{ inputs.project_dir }}
      WEB_PRESET: ${{ inputs.web_preset }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/godot-ci/${{ inputs.godot_version }}
            ~/.local/share/godot/export_templates/${{ inputs.godot_version }}.stable
          key: godot-linux-${{ inputs.godot_version }}-v1

      # The editor and only the templates we use: Web (no threads) and Android.
      - name: Install Godot ${{ inputs.godot_version }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          root="$HOME/godot-ci/$GODOT_VERSION"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          dl="$RUNNER_TEMP/godot-dl"
          mkdir -p "$root" "$tpl" "$dl"
          curl -sSL --fail --retry 3 -o "$dl/editor.zip" "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o "$dl/editor.zip" -d "$root"
          curl -sSL --fail --retry 3 -o "$dl/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -o -j "$dl/templates.tpz" \
            templates/web_nothreads_release.zip templates/android_debug.apk templates/android_release.apk \
            templates/android_source.zip templates/version.txt -d "$tpl"
          rm -rf "$dl"
          ls -l "$tpl"

      - name: Locate Godot
        run: |
          set -euo pipefail
          bin="$HOME/godot-ci/$GODOT_VERSION/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          [ -f "$bin" ] || { echo "Godot not found at $bin"; exit 1; }
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      # The old runner copied paid packs from a local disk; GitHub-hosted runners have none.
      - name: Check for licensed assets
        run: |
          if [ -f "$PROJECT_DIR/licensed-assets.txt" ]; then
            echo "::warning::$PROJECT_DIR/licensed-assets.txt exists but licensed assets are not available on GitHub-hosted runners; the build may be missing them"
          fi

      - name: Import
        run: |
          set -uo pipefail
          # The builds go to <project>/build: a .gdignore keeps Godot from importing their PNGs and
          # leaving .import files in what gets published.
          mkdir -p "$PROJECT_DIR/build"
          touch "$PROJECT_DIR/build/.gdignore"
          "$GODOT" --headless --path "$PROJECT_DIR" --import
          rc=$?
          if [ "$rc" -ne 0 ]; then echo "import failed (exit $rc)"; exit "$rc"; fi

      - name: Export Web
        run: |
          set -euo pipefail
          out="$PROJECT_DIR/build/web"
          rm -rf "$out"
          mkdir -p "$out"
          out_abs="$(cd "$out" && pwd)"
          (cd "$PROJECT_DIR" && "$GODOT" --headless --export-release "$WEB_PRESET" "$out_abs/index.html")
          for f in index.html index.js index.wasm index.pck; do
            [ -f "$out/$f" ] || { echo "no $f in the build"; ls -l "$out"; exit 1; }
          done

      - name: Stamp the build
        run: printf '%s\n' '${{ steps.commit.outputs.sha }}' > "$PROJECT_DIR/build/web/build-info.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ inputs.project_dir }}/build/web
          retention-days: 14
          if-no-files-found: error

      # Best effort: a debug APK signed with a throwaway debug keystore, using the runner's Android SDK and JDK 17.
      - name: Export Android debug APK
        if: inputs.android
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! grep -q '^name="Android"' "$PROJECT_DIR/export_presets.cfg" 2>/dev/null; then
            echo "no Android preset"; exit 0
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          jdk="${JAVA_HOME_17_X64:-}"
          if [ ! -d "$sdk" ] || [ -z "$jdk" ]; then echo "Android SDK or JDK 17 missing"; exit 1; fi
          ks="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          [ -f "$ks" ] || "$jdk/bin/keytool" -genkeypair -v -keystore "$ks" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          minor="${GODOT_VERSION%.*}"
          cfg="$HOME/.config/godot/editor_settings-${minor}.tres"
          mkdir -p "$(dirname "$cfg")"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$sdk\""
            echo "export/android/java_sdk_path = \"$jdk\""
            echo "export/android/debug_keystore = \"$ks\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$cfg"
          out="$PROJECT_DIR/build/android"
          rm -rf "$out"; mkdir -p "$out"
          out_abs="$(cd "$out" && pwd)"
          (cd "$PROJECT_DIR" && "$GODOT" --headless --export-debug Android "$out_abs/game-debug.apk")
          [ -f "$out/game-debug.apk" ] || { echo "no APK produced"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: inputs.android
        with:
          name: android
          path: ${{ inputs.project_dir }}/build/android/game-debug.apk
          retention-days: 14
          if-no-files-found: ignore

      # The front door pulls the `web` artifact every 5 minutes. The live page must serve this exact
      # commit, or the run fails and the epic reports ship-failed.
      - name: Verify the live build
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          LIVE_URL: ${{ inputs.live_url }}
        run: |
          url="${LIVE_URL%/}/build-info.txt"
          got=""
          for i in $(seq 1 30); do
            got="$(curl -sS --max-time 20 "$url" 2>&1 | head -n1 | tr -d '\r' || true)"
            if [ "$got" = "$SHA" ]; then echo "live build is $SHA"; exit 0; fi
            echo "attempt $i/30: live serves '$got', want $SHA"
            sleep 30
          done
          echo "::error::live site serves '$got', expected $SHA after 15 minutes"
          exit 1
